<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>人生博物馆 2.2 · Life Museum</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&display=swap" media="print" onload="this.media='all'">
<style>
/* ===== 基础 ===== */
:root{--glass:rgba(255,255,255,.08);--glass-b:rgba(255,255,255,.18);--text:#f3eeff;--sub:#c4b9ea;--accent:#ffb6e6;--accent2:#a8c8ff;--gold:#ffe29a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);min-height:100vh;overflow-x:hidden;background:radial-gradient(ellipse at 15% 0%,#4b2a8a 0%,transparent 55%),radial-gradient(ellipse at 90% 100%,#7a2a6e 0%,transparent 55%),linear-gradient(160deg,#0b0a24,#1d1050 60%,#3a1c6e);background-attachment:fixed}
#sky{position:fixed;inset:0;z-index:0;pointer-events:none}
#view{position:relative;z-index:1}
.title-font{font-family:"ZCOOL XiaoWei","STKaiti","KaiTi","Songti SC",serif;font-weight:normal}
.glow{text-shadow:0 0 20px rgba(255,182,230,.6),0 0 45px rgba(168,200,255,.4)}
.sub{color:var(--sub);line-height:1.8}
.hint{font-size:12px;color:var(--sub);opacity:.8;font-weight:normal}
.center{justify-content:center;text-align:center}
.view{animation:fadeUp .7s ease backwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes float{50%{transform:translateY(-12px)}}
@keyframes pulse{50%{box-shadow:0 6px 55px rgba(255,154,213,.95)}}
@keyframes goldGlow{50%{box-shadow:0 0 45px rgba(255,226,154,.6)}}
@keyframes cardIn{from{opacity:0;transform:perspective(900px) rotateY(-75deg) scale(.9)}to{opacity:1;transform:none}}
.float{animation:float 5s ease-in-out infinite}
::-webkit-scrollbar{height:8px;width:8px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:8px}
/* ===== 导航 ===== */
.nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:16px;padding:12px 24px;background:rgba(15,10,40,.55);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--glass-b)}
.brand{font-size:21px;cursor:pointer;white-space:nowrap}
.tabs{display:flex;gap:6px;flex:1;overflow-x:auto}
.tab{padding:8px 18px;border-radius:999px;cursor:pointer;color:var(--sub);white-space:nowrap;transition:.3s;font-size:15px}
.tab:hover{color:#fff;background:var(--glass)}
.tab.on{color:#fff;background:linear-gradient(135deg,rgba(255,182,230,.35),rgba(168,200,255,.35));box-shadow:0 0 20px rgba(255,182,230,.3)}
.nav-r{display:flex;gap:8px}
@media(max-width:760px){.nav{flex-wrap:wrap;padding:10px 14px;gap:10px}.tabs{order:3;width:100%;flex:none}.brand{font-size:17px}.nav-r .btn{padding:7px 11px;font-size:12px}}
/* ===== 按钮 ===== */
.btn{border:1px solid var(--glass-b);background:var(--glass);color:var(--text);padding:10px 18px;border-radius:999px;cursor:pointer;font-size:14px;transition:.3s;font-family:inherit;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.16);transform:translateY(-2px)}
.btn-primary{background:linear-gradient(135deg,#ff9ad5,#b69cff 50%,#8ec5ff);border:none;color:#2a1450;font-weight:600;box-shadow:0 6px 30px rgba(255,154,213,.45)}
.btn-primary:hover{box-shadow:0 8px 40px rgba(255,154,213,.75);background:linear-gradient(135deg,#ffaadd,#c2abff 50%,#9fd0ff)}
.btn.big{padding:16px 42px;font-size:18px}
.btn.sm{padding:6px 12px;font-size:12px}
.btn.danger{border-color:rgba(255,120,150,.5);color:#ffb3c6}
.pulse{animation:pulse 2.4s infinite}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.icon-btn{border:1px solid var(--glass-b);background:rgba(255,255,255,.06);color:#fff;border-radius:10px;padding:6px 10px;cursor:pointer;font-size:13px;font-family:inherit;transition:.2s;white-space:nowrap}
.icon-btn:hover{background:rgba(255,255,255,.16)}
.icon-btn.on{background:rgba(255,154,213,.35);border-color:rgba(255,182,230,.6)}
.icon-btn:disabled{opacity:.3;cursor:default}
/* ===== 通用 ===== */
.glass{background:var(--glass);border:1px solid var(--glass-b);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:24px}
.wrap{max-width:1200px;margin:0 auto;padding:32px 24px 100px}
.center-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px}
.orb{width:110px;height:110px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:52px;margin:0 auto 20px;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.5),rgba(255,182,230,.25) 40%,rgba(120,100,255,.15) 70%);box-shadow:0 0 60px rgba(255,182,230,.5),inset 0 0 30px rgba(255,255,255,.2)}
.orb.big{width:160px;height:160px;font-size:76px}
.eyebrow{letter-spacing:6px;font-size:12px;color:var(--sub);margin-bottom:12px}
.huge{font-size:clamp(34px,6vw,66px);margin-bottom:16px}
.motto{font-size:18px;color:var(--sub);margin:6px 0 28px;font-style:italic}
.stats{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:24px 0 32px}
.stat{padding:14px 22px;min-width:120px;text-align:center}
.stat b{display:block;font-size:26px;background:linear-gradient(135deg,#ffd1ec,#c6d8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{font-size:12px;color:var(--sub)}
.hero{text-align:center;margin:10px 0 20px}
.hero h1{font-size:clamp(28px,4vw,46px);margin-bottom:6px}
.section-title{font-size:24px;margin:44px 0 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.empty-state{text-align:center;padding:60px 20px;color:var(--sub);line-height:2}
/* ===== 表单 ===== */
.setup{max-width:540px;width:100%;padding:40px 36px;text-align:left}
.setup h1{text-align:center;font-size:32px;margin-bottom:8px}
.lb{display:block;margin:18px 0 8px;font-size:14px;color:var(--sub)}
input,textarea,select{width:100%;padding:12px 16px;border-radius:14px;border:1px solid var(--glass-b);background:rgba(255,255,255,.06);color:var(--text);font-size:15px;font-family:inherit;outline:none;transition:.3s}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,182,230,.2)}
input::placeholder,textarea::placeholder{color:rgba(220,210,255,.4)}
input[type=checkbox]{width:auto;accent-color:#ff9ad5;transform:scale(1.2)}
input[type=date]{color-scheme:dark}
select option{background:#24164d}
textarea{min-height:170px;resize:vertical;line-height:1.9}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{padding:6px 14px;border-radius:999px;font-size:13px;background:var(--glass);border:1px solid var(--glass-b);cursor:pointer;transition:.25s;user-select:none;display:inline-flex;align-items:center}
.chip:hover{background:rgba(255,182,230,.2)}
.chip.on{background:linear-gradient(135deg,rgba(255,154,213,.55),rgba(182,156,255,.55));border-color:transparent;box-shadow:0 0 14px rgba(255,154,213,.45)}
.chip.off{opacity:.35}
.chip i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:var(--c);box-shadow:0 0 8px var(--c)}
.avatars{display:flex;flex-wrap:wrap;gap:10px}
.av{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;background:var(--glass);border:1px solid var(--glass-b);cursor:pointer;transition:.25s}
.av.on{border-color:var(--accent);box-shadow:0 0 18px rgba(255,182,230,.7);transform:scale(1.12)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:600px){.row{grid-template-columns:1fr}}
.drop{display:flex;align-items:center;justify-content:center;padding:20px;border-radius:16px;border:2px dashed var(--glass-b);cursor:pointer;color:var(--sub);transition:.3s}
.drop:hover{border-color:var(--accent);color:#fff;background:rgba(255,182,230,.06)}
.thumbs{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px}
.thumb{position:relative;width:84px;height:84px;border-radius:12px;background-size:cover;background-position:center;cursor:pointer;border:1px solid var(--glass-b)}
.thumb b{position:absolute;bottom:4px;left:4px;font-size:10px;padding:2px 6px;border-radius:6px;background:rgba(255,154,213,.85);color:#2a1450}
.thumb i{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;background:#ff6f9c;font-style:normal;font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.seg{display:flex;background:rgba(255,255,255,.06);border-radius:999px;padding:4px;border:1px solid var(--glass-b)}
.seg button{flex:1;border:none;background:none;color:var(--sub);padding:10px;border-radius:999px;cursor:pointer;font-size:14px;transition:.3s;font-family:inherit}
.seg button.on{background:linear-gradient(135deg,#ff9ad5,#b69cff);color:#2a1450;font-weight:600}
.rating span{font-size:26px;cursor:pointer;opacity:.25;transition:.2s;color:#ffd36e}.rating span.on{opacity:1;text-shadow:0 0 10px #ffd36e}
.star-check{display:flex;align-items:center;gap:10px;margin-top:20px;cursor:pointer;flex-wrap:wrap}
.prompt-banner{padding:16px 18px;border-radius:16px;background:linear-gradient(135deg,rgba(255,154,213,.22),rgba(142,197,255,.22));border:1px solid var(--glass-b);line-height:1.8;margin-bottom:4px}
.m-title{font-size:28px;margin-bottom:16px}
.m-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:28px;flex-wrap:wrap}
.s-h{font-size:17px;margin:28px 0 4px}
details.more{margin-top:22px;border-radius:18px;border:1px dashed var(--glass-b);padding:2px 18px 18px}
details.more summary{cursor:pointer;padding:14px 0 4px;color:var(--sub);font-size:14px;list-style:none;user-select:none}
details.more summary::-webkit-details-marker{display:none}
details.more[open] summary{color:#fff}
.palette{display:flex;gap:10px;flex-wrap:wrap}
.pal{width:40px;height:40px;border-radius:50%;cursor:pointer;border:2px solid transparent;background:linear-gradient(135deg,var(--g1),var(--g2));transition:.2s}
.pal.on{border-color:#fff;transform:scale(1.12);box-shadow:0 0 16px var(--g1)}
/* ===== 编辑器：卡片类型 & 关联 ===== */
.type-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}
@media(max-width:560px){.type-grid{grid-template-columns:repeat(2,1fr)}}
.type-opt{padding:22px 14px;border-radius:22px;text-align:center;cursor:pointer;background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.03));border:1px solid var(--glass-b);transition:.3s}
.type-opt:hover{transform:translateY(-6px);border-color:var(--c);box-shadow:0 16px 40px -12px var(--c)}
.type-opt .t-icon{font-size:42px;display:block;margin-bottom:8px;filter:drop-shadow(0 0 12px var(--c))}
.type-opt .t-name{font-size:18px;display:block}
.type-opt .t-desc{font-size:12px;color:var(--sub);display:block;margin-top:6px;line-height:1.6}
.type-pill{display:inline-flex;align-items:center;gap:10px;padding:6px 8px 6px 16px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid var(--glass-b);font-size:14px;margin-bottom:6px}
.links-box{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.link-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 8px 6px 12px;border-radius:999px;font-size:13px;background:rgba(142,197,255,.15);border:1px solid var(--glass-b)}
.link-chip i{font-style:normal;cursor:pointer;width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:rgba(255,255,255,.15);font-size:10px}
.link-search{position:relative}
.link-drop{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:5;max-height:240px;overflow-y:auto;background:#2a1a58;border:1px solid var(--glass-b);border-radius:14px;padding:6px;box-shadow:0 14px 40px rgba(0,0,0,.4)}
.link-opt{padding:9px 12px;border-radius:10px;cursor:pointer;font-size:14px}
.link-opt:hover{background:rgba(255,182,230,.15)}
.link-opt.new{color:var(--accent)}
/* ===== 逛展：观展模式 & 展厅门 ===== */
.mode-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.mode-card{position:relative;padding:26px 22px;border-radius:26px;cursor:pointer;overflow:hidden;background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.03));border:1px solid var(--glass-b);transition:transform .2s,box-shadow .4s}
.mode-card::before{content:'';position:absolute;bottom:-80px;left:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,var(--g1),transparent 70%);opacity:.4;filter:blur(12px);transition:.5s}
.mode-card:hover{box-shadow:0 22px 60px -12px var(--g2)}
.mode-card:hover::before{opacity:.8;transform:scale(1.3)}
.mode-card .m-icon{font-size:44px;display:inline-block;filter:drop-shadow(0 0 14px var(--g1))}
.mode-card h3{font-size:21px;margin:10px 0 4px;position:relative}
.mode-card p{font-size:13px;color:var(--sub);line-height:1.7;position:relative}
.mode-card.soon{cursor:default}
.mode-card.soon .m-icon{filter:grayscale(.4) drop-shadow(0 0 10px var(--g1))}
.soon-tag{position:absolute;top:14px;right:14px;font-size:11px;padding:4px 10px;border-radius:999px;background:rgba(255,226,154,.18);color:var(--gold);border:1px solid rgba(255,226,154,.4)}
.halls{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}
.door{position:relative;padding:28px 24px;border-radius:28px;cursor:pointer;overflow:hidden;background:linear-gradient(160deg,rgba(255,255,255,.11),rgba(255,255,255,.03));border:1px solid var(--glass-b);transition:transform .2s,box-shadow .4s;animation:fadeUp .6s ease backwards}
.door::before{content:'';position:absolute;top:-70px;right:-70px;width:210px;height:210px;border-radius:50%;background:radial-gradient(circle,var(--g1),transparent 70%);opacity:.45;filter:blur(10px);transition:.5s}
.door:hover{box-shadow:0 22px 60px -12px var(--g2)}
.door:hover::before{opacity:.85;transform:scale(1.3)}
.door-icon{font-size:46px;display:inline-block;animation:float 4s ease-in-out infinite;filter:drop-shadow(0 0 14px var(--g1))}
.door h3{font-size:23px;margin:12px 0 4px}
.door p{font-size:13px;color:var(--sub)}
.door-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-top:18px}
.lock-tag{position:absolute;top:16px;right:16px;font-size:11px;padding:4px 10px;border-radius:999px;background:rgba(0,0,0,.35)}
.tilt::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.2),transparent 50%);opacity:0;transition:opacity .3s}
.tilt:hover::after{opacity:1}
.guide{display:flex;gap:20px;align-items:center;padding:24px 28px;margin:20px 0}
.guide-icon{font-size:56px}
.guide h3{font-size:19px;margin-bottom:4px}
@media(max-width:600px){.guide{flex-direction:column;text-align:center}.guide .btn-row{justify-content:center}}
/* ===== 展厅页 & 灵感卡 ===== */
.back{display:inline-block;color:var(--sub);cursor:pointer;font-size:14px;transition:.3s}.back:hover{color:#fff;transform:translateX(-4px)}
.hall-head{text-align:center;padding:16px 20px 0}
.hall-head .icon{font-size:72px;display:inline-block;filter:drop-shadow(0 0 25px var(--g1))}
.hall-head h1{font-size:44px;margin:8px 0 4px;background:linear-gradient(135deg,#fff,var(--g1));-webkit-background-clip:text;background-clip:text;color:transparent}
.prompts{padding:22px;margin:24px 0 30px}
.prompts-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.prompt-list{display:flex;gap:12px;overflow-x:auto;padding:6px 2px 12px;scroll-snap-type:x mandatory}
.prompt{position:relative;flex:0 0 230px;scroll-snap-align:start;padding:16px 16px 14px;border-radius:18px;background:linear-gradient(160deg,rgba(255,255,255,.13),rgba(255,255,255,.04));border:1px solid var(--glass-b);font-size:14px;line-height:1.7;cursor:pointer;transition:.3s}
.prompt:hover{transform:translateY(-5px);border-color:var(--g1);box-shadow:0 12px 30px -10px var(--g1)}
.prompt .p-type{display:block;font-size:12px;color:var(--g1);margin-bottom:4px}
.prompt .p-done{display:inline-block;margin-top:8px;font-size:11px;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.12);color:var(--g1)}
.prompt .p-hide{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;border:none;background:rgba(0,0,0,.3);color:#fff;cursor:pointer;font-size:12px;opacity:0;transition:.2s}
.prompt:hover .p-hide{opacity:1}
@media(hover:none){.prompt .p-hide{opacity:.75}}
.prompt.add{border-style:dashed;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--sub)}
/* ===== 回忆卡片 ===== */
.ex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:24px}
.ex-card{position:relative;border-radius:22px;overflow:hidden;cursor:pointer;background:rgba(255,255,255,.07);border:1px solid var(--glass-b);transition:transform .2s,box-shadow .4s}
.ex-card:hover{box-shadow:0 22px 50px -12px rgba(255,154,213,.55)}
.ex-card.star{border-color:rgba(255,226,154,.75);box-shadow:0 0 25px rgba(255,226,154,.3);animation:goldGlow 3s ease-in-out infinite}
.ex-cover{height:175px;background-size:cover;background-position:center}
.ex-cover.empty{display:flex;align-items:center;justify-content:center;font-size:58px;background:linear-gradient(135deg,var(--g1),var(--g2));opacity:.85}
.ex-body{padding:16px 18px 20px}
.ex-hall{font-size:11px;color:var(--sub);margin-bottom:6px}
.ex-body h4{font-size:17px;margin-bottom:6px;line-height:1.4}
.ex-meta{font-size:12px;color:var(--sub)}
.ex-excerpt{font-size:13px;color:#ddd5f7;margin-top:10px;line-height:1.7;opacity:.85}
.badges{position:absolute;top:12px;left:12px;display:flex;gap:6px;flex-wrap:wrap;z-index:2}
.badge{font-size:11px;padding:4px 10px;border-radius:999px;background:rgba(20,10,50,.7);backdrop-filter:blur(6px);color:#fff}
.badge.gold{color:var(--gold)}
.ex-card.person{text-align:center;padding-top:34px}
.p-avatar{width:110px;height:110px;margin:0 auto;border-radius:50%;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-size:48px;background-color:rgba(255,255,255,.1);box-shadow:0 0 0 4px rgba(255,255,255,.12),0 0 34px var(--c)}
.p-avatar.big{width:150px;height:150px;font-size:66px}
.p-rel{display:inline-block;margin-top:6px;font-size:12px;padding:3px 12px;border-radius:999px;background:var(--c);color:#2a1450;font-weight:600}
.ex-card.note{background:linear-gradient(160deg,rgba(255,240,250,.15),rgba(200,180,255,.07));min-height:210px}
.ex-card.note .ex-body{padding:30px 22px 22px}
.note-q{font-size:46px;line-height:.6;opacity:.35;font-family:Georgia,serif;display:block;margin-bottom:10px}
.ex-card.note .ex-excerpt{font-size:14px;font-family:"STKaiti","KaiTi",serif}
.ex-card.postcard{background:#fff9f0;color:#3b2a55;padding:10px 10px 0;border:none;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.postcard .ex-cover{border-radius:10px;height:165px}
.postcard .ex-meta,.postcard .ex-excerpt,.postcard .ex-hall{color:#7a6a95}
.postcard .ex-body{padding:12px 6px 16px;font-family:"STKaiti","KaiTi",serif}
.postcards .ex-card.postcard:nth-child(odd){rotate:-1.6deg}.postcards .ex-card.postcard:nth-child(even){rotate:1.3deg}
.stamp{position:absolute;top:18px;right:18px;padding:6px 9px;border:2px dashed #e57aa8;color:#e57aa8;background:#fff;font-size:11px;font-weight:700;rotate:8deg;z-index:2}
/* ===== 时光长河 ===== */
.tl{position:relative;max-width:920px;margin:30px auto}
.tl::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:2px;transform:translateX(-50%);background:linear-gradient(var(--accent),var(--accent2),transparent);box-shadow:0 0 14px var(--accent)}
.tl-year{position:relative;text-align:center;margin:34px 0 18px;z-index:1}
.tl-year span{display:inline-block;padding:6px 22px;border-radius:999px;background:linear-gradient(135deg,#ff9ad5,#b69cff);color:#2a1450;font-weight:700;box-shadow:0 0 22px rgba(255,154,213,.6)}
.tl-item{position:relative;width:50%;padding:12px 40px;animation:fadeUp .6s ease backwards}
.tl-item.right{left:50%}

#modal{position:fixed;inset:0;z-index:100;background:rgba(8,5,25,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;opacity:0;pointer-events:none;transition:.35s}

.modal-x{position:absolute;top:14px;right:14px;z-index:5;width:36px;height:36px;border-radius:50%;border:none;background:rgba(0,0,0,.4);color:#fff;font-size:16px;cursor:pointer}
.carousel{position:relative;margin:-32px -32px 24px;border-radius:24px 24px 0 0;overflow:hidden;background:#0a0618}

.cons-wrap{position:relative;height:72vh;min-height:460px;border-radius:28px;overflow:hidden;margin-top:18px;background:radial-gradient(circle at 50% 50%,rgba(255,226,154,.1),transparent 55%),rgba(10,6,30,.35);border:1px solid var(--glass-b)}

.hp-row span{flex:1}
/* ===== 提示条 ===== */
#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(120px);z-index:200;padding:12px 24px;border-radius:999px;background:rgba(42,26,88,.95);border:1px solid var(--glass-b);box-shadow:0 10px 40px rgba(255,154,213,.35);transition:.4s;font-size:14px;white-space:nowrap}
#toast.show{transform:translateX(-50%) translateY(0)}
.visitor-bar{position:fixed;bottom:20px;left:20px;z-index:60;display:none;align-items:center;gap:10px;padding:8px 8px 8px 18px;border-radius:999px;background:rgba(255,154,213,.2);border:1px solid rgba(255,182,230,.5);backdrop-filter:blur(12px);font-size:13px}
/* 人生博物馆 2.2 · 只补交互与动效，保留原版视觉语言 */

}
/* 不为布局、颜色、阴影建立过渡；光晕使用静态阴影和透明度层。 */
.tab,.btn,.icon-btn,.chip,.av,.drop,.seg button,.rating span,.pal,.type-opt,.mode-card,.door,.back,.prompt,.ex-card,.tl-card,.mini-type,.pending,.rel-item,.follow-opt,.cons-panel,input,textarea,select,.thumb,.modal-x,.p-hide,.cbtn,.link-opt,.link-chip i{transition-property:transform,opacity,filter;transition-duration:var(--t-mid);transition-timing-function:var(--ease-out)}
.mode-card::before,.door::before{transition:transform var(--t-slow) var(--ease-out),opacity var(--t-slow) var(--ease-out),filter var(--t-slow) var(--ease-out)}
:where(button,[role=button],a[href],summary,.chip,.tab,.brand,.av,.pal,.thumb,.prompt,.type-opt,.mini-type,.pending,.rel-item,.follow-opt,.link-opt,.link-chip i,.rating span,.drop,[onclick]){cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:where(button,[role=button],a[href],summary,.chip,.tab,.brand,.av,.pal,.thumb,.prompt,.type-opt,.mini-type,.pending,.rel-item,.follow-opt,.link-opt,.link-chip i,.rating span,.drop,[onclick]):focus-visible{outline:2px solid var(--accent2);outline-offset:4px}
:where(button,[role=button],a[href],summary,.chip,.tab,.brand,.av,.pal,.thumb,.prompt,.type-opt,.mini-type,.pending,.rel-item,.follow-opt,.link-opt,.link-chip i,.rating span,.drop,[onclick]):active{filter:brightness(1.1)}

.motion-active{will-change:transform,opacity,filter}
/* 路由的进出动画由一次 class 变更触发，结束后由运行时清理。 */
.view{animation:none}
.view.route-enter{animation:motionPageIn var(--t-route-in) var(--ease-out) both}
.view.route-leave{animation:motionPageOut var(--t-route-out) var(--ease-out) both;pointer-events:none}

@keyframes motionPageOut{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-6px)}}

@keyframes motionCardIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
/* 让选中导航底部的小胶囊移动，而不是重建导航。 */
.tabs{position:relative;padding-bottom:7px;isolation:isolate}
.nav-marker{position:absolute;left:0;bottom:0;width:24px;height:3px;border-radius:999px;pointer-events:none;background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:0 0 13px var(--accent);transform-origin:left center;transform:translateX(var(--nav-x,0px)) scaleX(var(--nav-scale,1));opacity:var(--nav-visible,0);transition:transform var(--t-slow) var(--ease-out),opacity var(--t-fast) var(--ease-out)}
/* 原版 3D 高光保留；悬停抬升和倾斜由同一个 transform 组合。 */
.tilt{--card-lift:0px;--card-scale:1;transform:perspective(900px) translateY(var(--card-lift)) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(var(--card-scale));transition:transform var(--t-mid) var(--ease-out),filter var(--t-mid) var(--ease-out);transform-style:preserve-3d}

:where(.ex-card,.tl-card,.mode-card,.door,.type-opt):hover{box-shadow:0 22px 50px -12px rgba(255,154,213,.55)}
:where(.ex-card,.tl-card,.mode-card,.door,.type-opt):not(.tilt):hover{transform:translateY(-6px) scale(1.02)}

/* 保留原来的渐变按钮，再叠一层可移动的轻薄光泽。 */
.btn,.icon-btn,.chip,.tab,.av,.pal{transition:transform var(--t-mid) var(--ease-spring),opacity var(--t-fast) var(--ease-out),filter var(--t-mid) var(--ease-out)}

/* 人生阶段横条沿用原版玻璃、圆角与字号，不另造视觉主题。 */
.motion-stage{position:relative;margin:18px 0;min-width:0;scroll-margin-top:var(--stage-offset,80px)}
.stage-row{display:flex;align-items:center;gap:10px;min-width:0}
.stage-row>.stage-head{flex:1;min-width:0}
.stage-head{position:relative;isolation:isolate;width:100%;display:flex;align-items:center;gap:14px;padding:17px 22px;border:1px solid var(--glass-b);border-radius:20px;background:linear-gradient(135deg,rgba(255,255,255,.09),rgba(255,255,255,.035));color:var(--text);font:inherit;text-align:left;overflow:hidden;scroll-margin-top:var(--stage-offset,80px);transition:transform var(--t-mid) var(--ease-out),filter var(--t-mid) var(--ease-out)}
.stage-head::before{content:'';position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(110deg,transparent 27%,rgba(255,255,255,.075) 49%,transparent 70%);transform:translateX(-110%);animation:motionStageSheen var(--t-sheen) var(--ease-out) infinite}
@keyframes motionStageSheen{0%,72%{transform:translateX(-110%)}100%{transform:translateX(110%)}}
.stage-head:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 0 25px rgba(255,182,230,.24)}

/* ============ 状态与存储 ============ */
let S={version:2,profile:null,halls:[],exhibits:[],hiddenPrompts:[],customPrompts:[],lastBackup:0};
const UI={view:'setup',hall:null,visitor:false,tl:'all',hallType:'all',aw:null,awHall:'all',plist:[],query:'',searchType:'all',openStage:null,openTheme:null};
let ED={},CUR={imgs:[],i:0},SETUP_AV='🌙',MODAL_SOFT=true,USE_LS=false;
const DB={db:null,
 open(){return new Promise((res,rej)=>{const r=indexedDB.open('lifeMuseum',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
 get(k){return new Promise((res,rej)=>{const q=this.db.transaction('kv','readonly').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})},
 set(k,v){return new Promise((res,rej)=>{const t=this.db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}};
async function save(){try{if(USE_LS)localStorage.setItem('lifeMuseum',JSON.stringify(S));else await DB.set('state',S);return true}catch(err){console.error(err);toast('⚠️ 保存失败，可能是存储空间不够了');return false}}
function migrate(d){
 if(!d||typeof d!=='object')d={};
 const s={version:2,profile:d.profile||null,
  halls:Array.isArray(d.halls)&&d.halls.length?d.halls:DEFAULT_HALLS.map(h=>({...h,g:[...h.g]})),
  exhibits:Array.isArray(d.exhibits)?d.exhibits:[],
  hiddenPrompts:Array.isArray(d.hiddenPrompts)?d.hiddenPrompts:[],
  customPrompts:Array.isArray(d.customPrompts)?d.customPrompts:[],
  lastBackup:d.lastBackup||0};
 const ids=new Set(s.halls.map(h=>h.id)),fallback=ids.has('childhood')?'childhood':s.halls[0].id;
 s.exhibits.forEach(e=>{
  if(!e.type||!TYPES[e.type])e.type=e.hall==='travel'?'travel':'event';
  if(!Array.isArray(e.links))e.links=[];
  if(!Array.isArray(e.images))e.images=[];
  if(!ids.has(e.hall))e.hall=fallback;
 });
 return s;
}

/* ============ 工具函数 ============ */
const $=id=>document.getElementById(id);
const val=id=>($(id)?$(id).value:'');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const hallOf=id=>S.halls.find(h=>h.id===id);
const hall=id=>hallOf(id)||S.halls[0]||DEFAULT_HALLS[1];
const hallLocked=h=>!!(h&&(h.secret||h.private));
const mood=id=>MOODS.find(m=>m.id===id);
const relOf=id=>RELS.find(r=>r.id===id)||RELS[RELS.length-1];
const fmtDate=d=>d?d.replace(/-/g,'.'):'';
const stat=(n,l)=>`<div class="stat glass"><b>${n}</b><span>${l}</span></div>`;
function ageAt(d){const b=S.profile&&S.profile.birth;if(!b||!d)return null;const B=new Date(b),D=new Date(d);let a=D.getFullYear()-B.getFullYear();const m=D.getMonth()-B.getMonth();if(m<0||(m===0&&D.getDate()<B.getDate()))a--;return a}
function timeLabel(e){let t=e.timeText||fmtDate(e.date);if(e.type==='travel'&&e.date&&e.endDate&&e.endDate!==e.date&&!e.timeText)t=fmtDate(e.date)+' - '+fmtDate(e.endDate);const a=ageAt(e.date);if(a!==null&&a>=0)t+=(t?' · ':'')+a+' 岁';return t}
function metaLine(e){
 const p=[],t=timeLabel(e);
 if(e.type==='person'){if(t)p.push('相识于 '+t)}
 else if(e.type==='fav'){if(e.category)p.push(e.category);if(t)p.push('从 '+t+' 开始喜欢')}
 else{if(t)p.push(t);if(e.place)p.push('📍'+e.place)}
 return p.join(' · ')}
const isVisible=e=>!UI.visitor||(!e.private&&!hallLocked(hallOf(e.hall)));
const visibleExhibits=()=>S.exhibits.filter(isVisible);
const shownHalls=()=>S.halls.filter(h=>!h.hidden&&!(UI.visitor&&hallLocked(h)));
function byDate(a,b){if(a.date&&b.date)return a.date.localeCompare(b.date);if(a.date)return -1;if(b.date)return 1;return(a.createdAt||0)-(b.createdAt||0)}
const exhibitsOf=hid=>visibleExhibits().filter(e=>e.hall===hid).sort(byDate);
function relatedOf(e){return visibleExhibits().filter(x=>x.id!==e.id&&((e.links||[]).includes(x.id)||(x.links||[]).includes(e.id)))}
function parseP(s,hid){const i=s.indexOf('|'),t=i>0?s.slice(0,i):'';return TYPES[t]?{q:s.slice(i+1),type:t,hall:hid}:{q:s,type:HALL_TYPE[hid]||'event',hall:hid}}
function promptsOf(hid,withHidden){
 const base=(PROMPTS[hid]||[]).map(s=>parseP(s,hid));
 const cus=S.customPrompts.filter(p=>p.hall===hid).map(p=>({q:p.q,type:TYPES[p.type]?p.type:(HALL_TYPE[hid]||'event'),hall:hid,custom:p.id}));
 const all=[...base,...cus];return withHidden?all:all.filter(p=>!S.hiddenPrompts.includes(p.q))}
function answerCount(){const m={};S.exhibits.forEach(e=>{if(e.prompt)m[e.prompt]=(m[e.prompt]||0)+1});return m}
const allPrompts=()=>S.halls.filter(h=>!h.hidden).flatMap(h=>promptsOf(h.id));
function travelStats(list){const c=new Set(),k=new Set();let days=0;list.forEach(e=>{if(e.place)c.add(e.place.trim());if(e.country)k.add(e.country.trim());if(e.date){const end=e.endDate&&e.endDate>=e.date?e.endDate:e.date;days+=Math.round((new Date(end)-new Date(e.date))/864e5)+1}});return{trips:list.length,cities:c.size,countries:k.size,days}}
function thumbStyle(e){const h=hall(e.hall),img=e.images&&e.images[0];return img?`background-image:url('${img}')`:`background:linear-gradient(135deg,${h.g[0]},${h.g[1]})`}
function thumbIcon(e){if(e.images&&e.images[0])return '';if(e.type==='person')return esc(Array.from(e.title||'?')[0]);const m=mood(e.mood);return m?m.e:(TYPES[e.type]||TYPES.event).icon}
let toastT;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600)}
function compress(file,max=1100,q=.75){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',q))};img.onerror=rej;img.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}

/* ============ 路由与渲染 ============ */
function go(v,h){if(UI.visitor&&(v==='studio'||v==='me'))v='explore';if(h&&h!==UI.hall)UI.hallType='all';UI.view=v;if(h)UI.hall=h;closeModal();render();window.scrollTo(0,0)}
function render(){
 const map={setup:renderSetup,entrance:renderEntrance,explore:renderExplore,hall:()=>renderHall(UI.hall),timeline:renderTimeline,search:renderSearch,studio:()=>renderStudio(),stars:()=>renderStars(),me:()=>renderMe()};
 $('view').innerHTML=`<div class="view">${(map[UI.view]||renderExplore)()}</div>`;
 updateNav();
 if(UI.view==='stars'&&typeof initCons==='function')initCons();
}
function updateNav(){
 const v=UI.view;$('nav').style.display=['setup','entrance'].includes(v)?'none':'flex';
 const act=['hall','timeline','search'].includes(v)?'explore':v;
 document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.v===act));
 ['tab-studio','tab-me','btn-add'].forEach(id=>{$(id).style.display=UI.visitor?'none':''});
 $('btn-visitor').textContent=UI.visitor?'🔓 退出访客':'👁 访客视角';
 $('visitor-bar').style.display=UI.visitor?'flex':'none';
}

function renderSetup(){return `<div class="center-screen"><div class="setup glass">

 </div>`}

/* ---- 回忆卡片（6 种样式） ---- */
function cardHTML(e){
 const h=hall(e.hall),T=TYPES[e.type]||TYPES.event,img=e.images&&e.images[0],meta=metaLine(e);
 const badges=`<div class="badges">${e.private&&!UI.visitor?'<span class="badge">🔒 独家</span>':''}${e.star?'<span class="badge gold">✨ 镇馆之宝</span>':''}${e.pending&&!UI.visitor?'<span class="badge">⏳ 待补充</span>':''}</div>`;
 const top=`<div class="ex-hall">${T.icon} ${T.n} · ${esc(h.icon)} ${esc(h.name)}</div>`;
 const ex=n=>e.story?`<p class="ex-excerpt">${esc(e.story.slice(0,n))}${e.story.length>n?'…':''}</p>`:'';
 const cls=`ex-card tilt ${e.star?'star':''}`,click=`data-exhibit-id="${esc(e.id)}" onclick="openExhibit('${e.id}')"`;
 if(e.type==='person'){const r=relOf(e.relation);
  return `<div class="${cls} person" style="--c:${r.c}" ${click}>${badges}<div class="p-avatar" style="${img?`background-image:url('${img}')`:''}">${img?'':thumbIcon(e)}</div><div class="ex-body">${top}<h4>${esc(e.title)}</h4><span class="p-rel">${r.n}${e.nickname?' · '+esc(e.nickname):''}</span>${meta?`<p class="ex-meta" style="margin-top:8px">${esc(meta)}</p>`:''}${ex(40)}</div></div>`}
 if(e.type==='note'&&!img)
  return `<div class="${cls} note" ${click}>${badges}<div class="ex-body"><span class="note-q">“</span>${top}<h4>${esc(e.title)}</h4>${ex(90)}${meta?`<p class="ex-meta" style="margin-top:10px">${esc(meta)}</p>`:''}</div></div>`;
 const pc=e.type==='travel';
 const cover=img?`<div class="ex-cover" style="background-image:url('${img}')"></div>`:`<div class="ex-cover empty" style="--g1:${h.g[0]};--g2:${h.g[1]}">${thumbIcon(e)}</div>`;
 return `<div class="${cls} ${pc?'postcard':''}" ${click}>${badges}${pc?`<div class="stamp">${esc(e.country||'✈ TRAVEL')}</div>`:''}${cover}<div class="ex-body">${top}<h4>${esc(e.title)}</h4>${meta?`<p class="ex-meta">${esc(meta)}</p>`:''}${ex(56)}</div></div>`}

function usePrompt(i){const p=UI.plist[i];if(p)openEditor({hall:p.hall,type:p.type,q:p.q})}
async function hidePromptAt(i){const p=UI.plist[i];if(!p)return;if(!S.hiddenPrompts.includes(p.q))S.hiddenPrompts.push(p.q);await save();render();toast('🙈 已隐藏，可以在「⚙️ 我的」里恢复')}
function renderHall(id){
 const h=hallOf(id);
 if(!h)return `<div class="wrap empty-state">这个展厅不存在了<br><button class="btn" style="margin-top:16px" onclick="go('explore')">← 返回逛展</button></div>`;
 if(UI.visitor&&hallLocked(h))return `<div class="wrap empty-state"><div style="font-size:70px">🔐</div>这里是馆主的私人展厅，访客止步～<br><button class="btn" style="margin-top:16px" onclick="go('explore')">← 返回逛展</button></div>`;
 const all=exhibitsOf(id),types=TYPE_ORDER.filter(t=>all.some(e=>e.type===t));
 if(UI.hallType!=='all'&&!types.includes(UI.hallType))UI.hallType='all';

 else{more=timeRow('📅 日期','🕰️ 或者写个大概时间','例如：小学三年级的夏天')+tip+`<div class="row">${f('e-place','📍 地点',ED.place,'例如：奶奶家的院子')}${f('e-people','👥 当时身边的人',ED.people,'例如：妈妈、同桌小林')}</div>`}
 const moodHTML=t==='person'?'':`<label class="lb">🎨 这段回忆的心情</label><div class="chips" id="e-moods">${MOODS.map(m=>`<span class="chip ${ED.mood===m.id?'on':''}" data-m="${m.id}" onclick="setMood('${m.id}')">${m.e} ${m.n}</span>`).join('')}</div>`;
 const priv=h.secret?`<div class="prompt-banner">🔐 秘密花园里的回忆，永远只有你自己能看到</div>`:h.private?`<div class="prompt-banner">🔒「${esc(h.name)}」是独家展厅，里面的回忆访客都看不到</div>`:`<div class="seg" id="e-priv"><button type="button" class="${ED.private?'':'on'}" onclick="setPriv(false)">🌍 对外展示</button><button type="button" class="${ED.private?'on':''}" onclick="setPriv(true)">🔒 独家记忆</button></div><p class="hint" style="margin-top:8px" id="e-priv-hint">${privHint()}</p>`;

 return `<h2 class="m-title title-font">${ED.id?'✏️ 编辑回忆':'✨ 收藏一段新回忆'}</h2>
 <div class="type-pill">${T.icon} 卡片类型 <select id="e-type" onchange="edType(this.value)" style="width:auto;padding:6px 14px;border-radius:999px;font-size:13px">${TYPE_ORDER.map(x=>`<option value="${x}" ${x===t?'selected':''}>${TYPES[x].icon} ${TYPES[x].n}</option>`).join('')}</select></div>
 ${ED.prompt?`<div class="prompt-banner" style="margin-top:10px">💭 ${esc(ED.prompt)}<br><span class="hint">慢慢想，不用写得很完美。哪怕只记得一个画面，也值得被收藏。</span></div>`:''}
 ${ED.pending&&ED.id?`<div class="prompt-banner" style="margin-top:10px">⏳ 这是速记下来的回忆，补充点故事或照片吧<br><span class="hint">写了故事或加了照片，它就会离开「待补充」清单</span></div>`:''}

 <label class="drop" ondragover="event.preventDefault();this.style.borderColor='#ffb6e6'" ondragleave="this.style.borderColor=''" ondrop="event.preventDefault();this.style.borderColor='';addImgs(event.dataTransfer.files)">＋ 点击添加照片<input type="file" accept="image/*" multiple hidden onchange="addImgs(this.files);this.value=''"></label>
 <div class="thumbs" id="e-thumbs">${thumbsHTML()}</div>

 <label class="lb">🔐 谁可以看到这段回忆？</label>${priv}

  ${more}
  ${moodHTML}
  <label class="lb">🔗 关联其他回忆 <span class="hint">（比如把「演唱会」关联到「周杰伦」和「闺蜜」，打开任意一张都能看到彼此）</span></label>
  <div class="links-box" id="e-links">${linksHTML()}</div>
  <div class="link-search"><input id="e-lq" autocomplete="off" placeholder="搜索已有的回忆，或输入名字新建（例如：周杰伦）" oninput="linkSearch()" onfocus="linkSearch()" onblur="setTimeout(hideLinkDrop,180)"><div class="link-drop" id="e-ld" style="display:none"></div></div>
  <div class="row"><div><label class="lb">🏛️ 放进哪个展厅</label><select id="e-hall" onchange="edHall(this.value)">${halls.map(x=>`<option value="${x.id}" ${x.id===h.id?'selected':''}>${esc(x.icon)} ${esc(x.name)}</option>`).join('')}</select></div><div></div></div>
  <label class="star-check"><input type="checkbox" id="e-star" ${ED.star?'checked':''}> ✨ 设为「镇馆之宝」<span class="hint">（会在逛展页最上方发光展示）</span></label>
 </details>
 <div class="m-actions"><button class="btn" onclick="tryClose()">取消</button><button class="btn btn-primary" id="e-save" onclick="saveExhibit()">✨ ${ED.id?'保存修改':'收藏进博物馆'}</button></div>`}
function edSync(){
 const set=(k,id)=>{const el=$(id);if(el)ED[k]=el.value};
 [['type','e-type'],['hall','e-hall'],['title','e-title'],['date','e-date'],['timeText','e-time'],['place','e-place'],['people','e-people'],['story','e-story'],['endDate','e-end'],['country','e-country'],['companions','e-comp'],['nickname','e-nick'],['quote','e-quote'],['whereNow','e-where']].forEach(([k,id])=>set(k,id));
 if($('e-timeline'))ED.river=$('e-timeline').checked;if($('e-stage'))ED.stage=$('e-stage').value;
 if($('e-star'))ED.star=$('e-star').checked;if($('e-more'))ED._open=$('e-more').classList.contains('detail-open')}
function rerenderEditor(){const m=$('modal'),st=m.scrollTop;openModal(editorHTML(),true);m.scrollTop=st}
function edType(t){edSync();ED.type=t;rerenderEditor()}
function edHall(id){edSync();ED.hall=id;if(!ED.id&&!ED._riverTouched)ED.river=hall(id).kind==='stage';if(hall(id).secret)ED.private=true;rerenderEditor()}
function setRel(id){ED.relation=id;document.querySelectorAll('#e-rel .chip').forEach(c=>c.classList.toggle('on',c.dataset.v===id))}
function setCat(el){const c=el.dataset.v;ED.category=ED.category===c?'':c;document.querySelectorAll('#e-cat .chip').forEach(x=>x.classList.toggle('on',x.dataset.v===ED.category))}
function setMood(id){ED.mood=ED.mood===id?null:id;document.querySelectorAll('#e-moods .chip').forEach(c=>c.classList.toggle('on',c.dataset.m===ED.mood))}
function setPriv(b){ED.private=b;document.querySelectorAll('#e-priv button').forEach((x,i)=>x.classList.toggle('on',(i===1)===b));const hn=$('e-priv-hint');if(hn)hn.textContent=privHint()}
function setRating(n){ED.rating=ED.rating===n?0:n;document.querySelectorAll('#e-rating span').forEach((s,i)=>s.classList.toggle('on',i<ED.rating))}
function insertHint(i){const t=$('e-story'),txt=STORY_HINTS[ED.type][i][1],focused=document.activeElement===t;const s=focused?t.selectionStart:t.value.length,en=focused?t.selectionEnd:s;const before=t.value.slice(0,s),pre=before&&!before.endsWith('\n')?'\n':'';t.value=before+pre+txt+t.value.slice(en);const pos=(before+pre+txt).length;t.focus();t.setSelectionRange(pos,pos)}
/* ---- 关联 ---- */
function refreshLinks(){const b=$('e-links');if(b)b.innerHTML=linksHTML()}
function hideLinkDrop(){const d=$('e-ld');if(d){d.innerHTML='';d.style.display='none'}}
function linkSearch(){
 const raw=val('e-lq').trim(),q=raw.toLowerCase(),d=$('e-ld');if(!d)return;
 const pool=S.exhibits.filter(x=>x.id!==ED.id&&!ED.links.includes(x.id));
 let list=q?pool.filter(x=>(x.title||'').toLowerCase().includes(q)||(x.nickname||'').toLowerCase().includes(q)):pool.filter(x=>x.type==='person'||x.type==='fav').sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
 let html=list.slice(0,8).map(x=>`<div class="link-opt" onmousedown="event.preventDefault();addLink('${x.id}')">${(TYPES[x.type]||TYPES.event).icon} ${esc(x.title)} <span class="hint">${esc(hall(x.hall).name)}</span></div>`).join('');
 if(raw&&!S.exhibits.some(x=>x.title===raw)&&!ED.newLinks.some(n=>n.title===raw))html+=['person','fav','event','item'].map(t=>`<div class="link-opt new" onmousedown="event.preventDefault();addNewLink('${t}')">＋ 新建${TYPES[t].icon}${TYPES[t].n}卡片「${esc(raw)}」</div>`).join('');
 if(!html)html=`<div class="link-opt hint" style="cursor:default">输入名字搜索，或者新建一张卡片</div>`;
 d.innerHTML=html;d.style.display='block'}
function addLink(id){if(!ED.links.includes(id))ED.links.push(id);$('e-lq').value='';refreshLinks();hideLinkDrop()}
function addNewLink(t){const raw=val('e-lq').trim();if(!raw)return;ED.newLinks.push({type:t,title:raw});$('e-lq').value='';refreshLinks();hideLinkDrop();toast(`保存后会新建「${raw}」这张卡片 ✨`)}
function rmLink(id){ED.links=ED.links.filter(x=>x!==id);refreshLinks()}
function rmNewLink(i){ED.newLinks.splice(i,1);refreshLinks()}
/* ---- 照片 ---- */
async function addImgs(files){files=[...files].filter(f=>f.type.startsWith('image/'));if(!files.length)return;const room=12-ED.images.length;if(room<=0){toast('每段回忆最多放 12 张照片');return}toast(files.length>room?`最多还能放 ${room} 张，多出的已略过`:'📷 正在冲洗照片…');for(const f of files.slice(0,room)){try{ED.images.push(await compress(f))}catch(err){toast('有一张照片读取失败了（可能是格式不支持）')}}refreshThumbs()}
function refreshThumbs(){const t=$('e-thumbs');if(t)t.innerHTML=thumbsHTML()}
function rmImg(i){ED.images.splice(i,1);refreshThumbs()}
function setCover(i){if(!i)return;const [im]=ED.images.splice(i,1);ED.images.unshift(im);refreshThumbs();toast('已设为封面 ✨')}
/* ---- 保存 ---- */
async function saveExhibit(){
 const saveModalSerial=motionModalSerial;
 edSync();const title=(ED.title||'').trim();
 if(!title){toast('先给它起个名字吧 ✨');$('e-title').focus();return}
 const t=ED.type,isNew=!ED.id,h=hall(ED.hall),tr=k=>(ED[k]||'').trim();
 if(t==='travel'&&ED.date&&ED.endDate&&ED.endDate<ED.date){toast('返程日期比出发日期还早，检查一下吧');return}
 const id=ED.id||uid(),now=Date.now();
 const e={...(S.exhibits.find(x=>x.id===id)||{}),id,type:t,hall:h.id,title,prompt:ED.prompt||'',date:ED.date||'',timeText:tr('timeText'),place:tr('place'),people:tr('people'),story:ED.story||'',mood:ED.mood||null,images:ED.images||[],private:h.secret?true:!!ED.private,star:!!ED.star,river:ED.river===true,stage:ED.stage||'',createdAt:ED.createdAt||now,updatedAt:now};
 e.pending=!!ED.pending&&!e.story.trim()&&!e.images.length;
 if(t==='person'){e.relation=ED.relation||'friend';e.nickname=tr('nickname');e.quote=tr('quote')}
 if(t==='fav')e.category=ED.category||'';
 if(t==='item')e.whereNow=tr('whereNow');
 if(t==='travel'){e.endDate=ED.endDate||'';e.country=tr('country');e.companions=tr('companions');e.rating=ED.rating||0}
 const favOk=hallOf('fav')&&!hallOf('fav').hidden;
 const created=(ED.newLinks||[]).map((n,i)=>{const c={id:uid()+i,type:n.type,hall:n.type==='fav'&&favOk?'fav':h.id,title:n.title,prompt:'',date:'',timeText:'',place:'',people:'',story:'',mood:null,images:[],private:e.private,star:false,river:hall(n.type==='fav'&&favOk?'fav':h.id).kind==='stage',stage:'',pending:true,links:[id],createdAt:now,updatedAt:now};if(n.type==='person')Object.assign(c,{relation:'friend',nickname:'',quote:''});return c});
 const links=[...new Set([...(ED.links||[]).filter(x=>S.exhibits.some(y=>y.id===x)),...created.map(c=>c.id)])];
 e.links=links;
 let list=isNew?[...S.exhibits,e]:S.exhibits.map(x=>x.id===id?e:x);
 list=[...list,...created].map(x=>{if(x.id===id)return x;const cur=x.links||[],has=cur.includes(id),want=links.includes(x.id);if(want&&!has)return{...x,links:[...cur,id]};if(!want&&has)return{...x,links:cur.filter(y=>y!==id)};return x});
 const old=S.exhibits;S.exhibits=list;
 if(!(await save())){S.exhibits=old;return}
 if(saveModalSerial!==motionModalSerial){render();return}
 MODAL_SOFT=true;render();
 if(isNew)openFollow(id,true);else{closeModal();toast('✨ 回忆已更新'+(created.length?`，并新建了 ${created.length} 张卡片`:''))}
}

function openFollow(id,fresh){
 const e=S.exhibits.find(x=>x.id===id);if(!e)return;
 const opts=FOLLOW[e.type]||FOLLOW.event,cnt=answerCount();
 const next=promptsOf(e.hall).filter(p=>!cnt[p.q]&&p.q!==e.prompt)[0];UI.followNext=next||null;

 MODAL_SOFT=true;
 openModal(`<div style="text-align:center"><div class="orb float" style="width:90px;height:90px;font-size:42px">🧶</div><h2 class="m-title title-font">${fresh?`✨「${esc(e.title)}」已入馆收藏`:'🧶 顺着这段，继续回忆'}</h2><p class="sub">回忆就像毛线团，拉住一头，就能牵出更多。要不要顺着继续？</p></div>
 ${pend.map(p=>`<div class="follow-opt" onclick="openEditor({id:'${p.id}'})"><b>⏳</b><span>补充一下「${esc(p.title)}」<br><span class="hint">刚刚新建的${TYPES[p.type].n}卡片，还空着呢</span></span></div>`).join('')}
 ${opts.map(([t,ic,q])=>`<div class="follow-opt" onclick="openEditor({type:'${t}',link:'${id}'})"><b>${ic}</b><span>${q}<br><span class="hint">会新建一张${TYPES[t].n}卡片，并自动和「${esc(e.title)}」关联</span></span></div>`).join('')}
 ${next?`<div class="follow-opt" onclick="openEditor({hall:UI.followNext.hall,type:UI.followNext.type,q:UI.followNext.q})"><b>💭</b><span>${esc(next.q)}<br><span class="hint">「${esc(hall(e.hall).name)}」里的下一个灵感</span></span></div>`:''}
 <div class="m-actions"><button class="btn" onclick="go('studio')">🎴 去记忆唤醒</button><button class="btn btn-primary" onclick="closeModal()">先到这里 ✨</button></div>`);
}

/* ============ 收藏台：记忆唤醒 / 速记 / 待补充 ============ */
function pickAwaken(){const cnt=answerCount();let pool=allPrompts().filter(p=>!cnt[p.q]);if(UI.awHall!=='all')pool=pool.filter(p=>p.hall===UI.awHall);if(!pool.length)return null;let c,n=0;do{c=pool[Math.floor(Math.random()*pool.length)];n++}while(pool.length>1&&UI.aw&&c.q===UI.aw.q&&n<20);return c}
function nextAwaken(){UI.aw=pickAwaken();render()}
function setAwHall(id){UI.awHall=id;UI.aw=null;render()}
function writeAwaken(){const a=UI.aw;if(a)openEditor({hall:a.hall,type:a.type,q:a.q})}
async function hideAwaken(){const a=UI.aw;if(!a)return;if(!S.hiddenPrompts.includes(a.q))S.hiddenPrompts.push(a.q);await save();UI.aw=pickAwaken();render();toast('🙈 已隐藏，可以在「⚙️ 我的」里恢复')}
function renderStudio(){
 const cnt=answerCount(),halls=S.halls.filter(h=>!h.hidden);
 if(UI.awHall!=='all'&&!halls.some(h=>h.id===UI.awHall))UI.awHall='all';
 const a0=UI.aw;
 if(!a0||cnt[a0.q]||S.hiddenPrompts.includes(a0.q)||!hallOf(a0.hall)||(UI.awHall!=='all'&&a0.hall!==UI.awHall))UI.aw=pickAwaken();
 const a=UI.aw,h=a?hall(a.hall):null,T=a?TYPES[a.type]:null;
 const pend=S.exhibits.filter(e=>e.pending).sort((x,y)=>(y.updatedAt||0)-(x.updatedAt||0));
 const chips=[{id:'all',icon:'🌌',name:'全部'},...halls].map(x=>`<span class="chip ${UI.awHall===x.id?'on':''}" onclick="setAwHall('${x.id}')">${esc(x.icon)} ${esc(x.name)}</span>`).join('');
 const card=a?`<div class="aw-card" style="--g1:${h.g[0]};--g2:${h.g[1]}"><div class="aw-icon">${esc(h.icon)}</div><div class="aw-tag">${esc(h.name)} · ${T.icon} ${T.n}</div><div class="aw-q title-font">${esc(a.q)}</div><p class="hint">闭上眼睛想一想，哪怕只记得一个画面也很好</p><div class="btn-row" style="justify-content:center;margin-top:22px"><button class="btn btn-primary" onclick="writeAwaken()">✍️ 写下这段回忆</button><button class="btn" onclick="nextAwaken()">🔄 换一个</button><button class="btn" onclick="hideAwaken()">🙈 不适合我</button></div></div>`
  :`<div class="aw-card"><div class="aw-icon">🎉</div><div class="aw-q title-font">${UI.awHall==='all'?'灵感库里的问题都写过啦！':'这个展厅的灵感都写过啦'}</div><p class="sub">去展厅里「✍️ 出一道自己的题」，或者直接自由收藏吧 ✨</p>${UI.awHall!=='all'?`<div class="btn-row" style="justify-content:center"><button class="btn btn-primary" onclick="setAwHall('all')">看看其他展厅</button></div>`:''}</div>`;
 return `<div class="wrap"><div class="hero"><p class="eyebrow">MEMORY STUDIO</p><h1 class="title-font glow">✍️ 收藏台</h1><p class="sub">你已经收藏了 <b>${S.exhibits.length}</b> 段回忆 · 想到什么，就从这里开始</p></div>
 <div class="studio">
  <div class="panel glass"><h2 class="title-font">💫 记忆唤醒</h2><p class="sub" style="font-size:13px">我来提问，你来回忆。想不起来就换一个，没关系～</p><div class="chips">${chips}</div>${card}</div>

async function saveProfile(){const p=readProfile();if(!p)return;const old=S.profile;S.profile=p;if(!(await save())){S.profile=old;return}render();toast('✨ 馆主信息已更新')}
async function moveHall(id,d){const i=S.halls.findIndex(h=>h.id===id),j=i+d;if(i<0||j<0||j>=S.halls.length)return;[S.halls[i],S.halls[j]]=[S.halls[j],S.halls[i]];await save();render()}
async function toggleHall(id,k){
 const h=hallOf(id);if(!h)return;
 if(k==='hidden'&&!h.hidden&&S.halls.filter(x=>!x.hidden).length<=1){toast('至少要留一个展厅哦');return}
 h[k]=!h[k];await save();render();
 toast(k==='hidden'?(h.hidden?`🙈「${h.name}」已从导览里收起`:`👁「${h.name}」重新开放`):(h.private?`🔒「${h.name}」已设为独家展厅`:`🌍「${h.name}」已对外开放`))}
async function delHall(id){
 const h=hallOf(id);if(!h)return;const rest=S.halls.filter(x=>x.id!==id);
 if(!rest.some(x=>!x.hidden)){toast('至少要留一个展厅哦');return}
 const target=rest.find(x=>!x.hidden&&!x.secret)||rest.find(x=>!x.hidden),n=S.exhibits.filter(e=>e.hall===id).length;
 if(!confirm(`确定删除「${h.name}」吗？${n?`\n里面的 ${n} 段回忆会移到「${target.name}」，不会丢失。`:''}`))return;
 const locked=hallLocked(h);
 S.exhibits.forEach(e=>{if(e.hall===id){e.hall=target.id;if(locked)e.private=true}});
 S.customPrompts=S.customPrompts.filter(p=>p.hall!==id);S.halls=rest;

function exportData(){
 const blob=new Blob([JSON.stringify({app:'lifeMuseum',...S})],{type:'application/json'});
 const a=document.createElement('a'),d=new Date(),p=x=>String(x).padStart(2,'0');
 a.href=URL.createObjectURL(blob);a.download=`人生博物馆备份-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}.json`;
 document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
 S.lastBackup=Date.now();save().then(()=>{if(UI.view==='me')render()});toast('📤 备份文件已下载，请妥善保存')}
function importData(inp){
 const f=inp.files[0];if(!f)return;const r=new FileReader();
 r.onload=async()=>{
  let d=null;try{d=JSON.parse(r.result)}catch(e){}
  if(!d||!Array.isArray(d.exhibits)){toast('⚠️ 这个文件好像不是博物馆的备份');return}
  if(!confirm(`备份里有 ${d.exhibits.length} 段回忆。\n导入会替换当前博物馆的全部内容，确定吗？`))return;
  const old=S;S=migrate(d);if(!S.profile)S.profile=old.profile;
  if(!(await save())){S=old;return}
  applyMuseumUI(S.ui,false);UI.openStage=null;UI.openTheme=null;
  CONS.pos={};CONS.sel=null;if(S.profile)SETUP_AV=S.profile.avatar||'🌙';
  closeModal();UI.view=S.profile?'explore':'setup';render();toast('📥 导入成功，欢迎回来 ✨')};
 r.readAsText(f);inp.value=''}
async function resetAll(){
 if(!confirm('确定要清空整座博物馆吗？所有回忆都会被删除！'))return;
 if(!confirm('最后确认一次：真的要清空吗？建议先导出备份。'))return;
 S=migrate(null);applyMuseumUI(S.ui,false);UI.openStage=null;UI.openTheme=null;CONS.pos={};CONS.sel=null;SETUP_AV='🌙';await save();closeModal();UI.view='setup';render();toast('博物馆已清空')}

 return {...a,preset:Object.hasOwn(MUSEUM_PRESETS,a.preset)?a.preset:'dream',bg:museumImageURL(a.bg)?a.bg:'',bgDim:finite(a.bgDim,.45,0,.8),bgBlur:finite(a.bgBlur,0,0,12),stars:a.stars!==false};

let museumUIBackgroundKey='',museumUIBackgroundRevision=0,museumUIBackgroundTimer=0,museumUIBackgroundFrames=[],museumUISaveRevision=0,museumUISaveQueue=Promise.resolve(),museumUICommitted=null,museumUIEpoch=0;
function applyMuseumUI(value,animate=true){
 const ui=normalizeMuseumUI(value),preset=MUSEUM_PRESETS[ui.preset],calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
 if(museumUICommitted===null||!animate){museumUICommitted={...ui};if(!animate){museumUIEpoch++;museumUISaveRevision++}}
 const rootStyle=document.documentElement.style;
 const vars={'--museum-bg':preset.background,'--accent':preset.accent,'--accent2':preset.accent2,'--glass':preset.glass,'--glass-b':preset.glassB,'--text':preset.text,'--sub':preset.sub,'--gold':preset.gold,'--museum-surface':preset.surface,'--museum-nav':preset.nav,'--button-a':preset.buttonA,'--button-b':preset.buttonB,'--button-c':preset.buttonC,'--button-hover-a':preset.buttonHoverA||preset.buttonA,'--button-hover-b':preset.buttonHoverB||preset.buttonB,'--button-hover-c':preset.buttonHoverC||preset.buttonC,'--button-text':preset.buttonText};
 Object.entries(vars).forEach(([key,value])=>rootStyle.setProperty(key,value));
 document.documentElement.dataset.museumPreset=ui.preset;
 let root=document.getElementById('museum-background');
 if(!root){root=document.createElement('div');root.id='museum-background';root.className='museum-background';root.setAttribute('aria-hidden','true');const stack=document.createElement('div');stack.id='museum-bg-stack';stack.className='museum-bg-stack';const shade=document.createElement('div');shade.id='museum-bg-shade';shade.className='museum-bg-dim';root.append(stack,shade);document.body.insertBefore(root,document.body.firstChild)}
 const stack=document.getElementById('museum-bg-stack'),shade=document.getElementById('museum-bg-shade');
 if(!animate)root.classList.add('ui-instant');
 stack.style.filter=`blur(${ui.bg?ui.bgBlur:0}px)`;shade.style.opacity=ui.bg?String(ui.bgDim):'0';
 const key=ui.preset+'|'+ui.bg;
 if(key!==museumUIBackgroundKey||!stack.childElementCount){
  museumUIBackgroundKey=key;const revision=++museumUIBackgroundRevision;
  clearTimeout(museumUIBackgroundTimer);museumUIBackgroundFrames.forEach(cancelAnimationFrame);museumUIBackgroundFrames=[];
  const layer=document.createElement('div');layer.className='museum-bg-layer';layer.style.backgroundImage=ui.bg?`url("${ui.bg}")`:preset.background;
  if(!animate||calm||!stack.childElementCount){layer.classList.add('is-visible');stack.replaceChildren(layer)}
  else{stack.appendChild(layer);layer.classList.add('motion-active');museumUIBackgroundFrames.push(requestAnimationFrame(()=>{if(revision!==museumUIBackgroundRevision)return;museumUIBackgroundFrames.push(requestAnimationFrame(()=>{if(revision!==museumUIBackgroundRevision)return;layer.classList.add('is-visible');museumUIBackgroundTimer=setTimeout(()=>{if(revision!==museumUIBackgroundRevision)return;for(const old of [...stack.children])if(old!==layer)old.remove();layer.classList.remove('motion-active');museumUIBackgroundFrames=[]},620)}))}))}
 }
 if(!animate)requestAnimationFrame(()=>requestAnimationFrame(()=>root.classList.remove('ui-instant')));
 if(window.museumSky){if(window.museumSky.setPalette)window.museumSky.setPalette(preset.palette);window.museumSky.setEnabled(ui.stars)}
 updateMuseumUIControls(ui);
}
function updateMuseumUIControls(value){
 const ui=normalizeMuseumUI(value);
 document.querySelectorAll('[data-museum-preset]').forEach(button=>{const on=button.dataset.museumPreset===ui.preset;button.classList.toggle('on',on);button.setAttribute('aria-pressed',String(on))});
 const set=(id,text)=>{const el=document.getElementById(id);if(el)el.textContent=text};
 set('museum-bg-dim-value',Math.round(ui.bgDim*100)+'%');set('museum-bg-blur-value',ui.bgBlur+'px');set('museum-background-status',ui.bg?'已使用背景照片':'正在使用主题渐变背景');
 const dimInput=document.getElementById('museum-bg-dim'),blur=document.getElementById('museum-bg-blur'),stars=document.getElementById('museum-stars'),clear=document.getElementById('museum-background-clear');
 if(dimInput)dimInput.value=ui.bgDim;if(blur)blur.value=ui.bgBlur;if(stars)stars.checked=ui.stars;if(clear)clear.disabled=!ui.bg;

function configureMuseumUI(key,value){
 if(!['preset','bg','bgDim','bgBlur','stars'].includes(key))return Promise.resolve(false);
 const previous=normalizeMuseumUI(S.ui),next=normalizeMuseumUI({...previous,[key]:value}),revision=++museumUISaveRevision,epoch=museumUIEpoch;
 S.ui=next;applyMuseumUI(next,true);
 museumUISaveQueue=museumUISaveQueue.catch(()=>false).then(async()=>{
  if(revision!==museumUISaveRevision||epoch!==museumUIEpoch)return true;
  const snapshot=normalizeMuseumUI(S.ui);let ok=false;
  try{ok=await save()}catch(error){toast('外观暂时未能保存，请稍后再试')}
  if(epoch!==museumUIEpoch)return ok;
  if(ok)museumUICommitted={...snapshot};else if(revision===museumUISaveRevision){S.ui={...(museumUICommitted||previous)};applyMuseumUI(S.ui,true)}
  return ok;
 });return museumUISaveQueue;
}
async function uploadMuseumBackground(input){
 const file=input.files&&input.files[0];input.value='';if(!file)return;
 if(!file.type.startsWith('image/')){toast('请选择一张图片');return}
 if(file.size>20*1024*1024){toast('请选一张 20MB 以内的背景图');return}
 const status=document.getElementById('museum-background-status');if(status)status.textContent='正在准备背景照片…';
 try{const image=await compress(file,1920,.8);if(!museumImageURL(image)){toast('这张图片暂时无法使用');updateMuseumUIControls(S.ui);return}if(await configureMuseumUI('bg',image))toast('✨ 背景图已保存')}
 catch(error){updateMuseumUIControls(S.ui);toast('图片没能读取，换一张试试')}
}
function clearMuseumBackground(){return configureMuseumUI('bg','')}
